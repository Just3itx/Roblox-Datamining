name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]
  pull_request:
    paths-ignore: ["data/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Smoke test against live Roblox endpoints
        run: node src/cli.ts versions fflags --data-dir "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/out" --readme /dev/null
